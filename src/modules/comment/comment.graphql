type Comment {
  id: ID!
  content: String!
  postId: ID!
  authorId: ID!
  createdAt: String!
  # Relationship: Comment author
  author: User!
  # Relationship: Post this comment belongs to
  post: Post!
}

# Input types for mutations
input CreateCommentInput {
  content: String!
  postId: ID!
  authorId: ID!
}

# Response type for delete operations
type DeleteResponse {
  success: Boolean!
  message: String!
}

extend type Query {
  # Fetch all comments
  comments: [Comment!]!
  # Fetch a specific comment by ID
  comment(id: ID!): Comment
  # Fetch comments for a specific post
  commentsByPost(postId: ID!): [Comment!]!
}

extend type Mutation {
  # Create a new comment
  createComment(input: CreateCommentInput!): Comment!
  # Delete a comment by ID
  deleteComment(id: ID!): DeleteResponse!
}

extend type Subscription {
  # Subscribe to new comments being created
  commentAdded: Comment!
  # Subscribe to comments being deleted
  commentDeleted: DeleteResponse!
}